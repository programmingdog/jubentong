# ---------------------------------------------------------------------------
# 宝塔面板 · 抖音解析服务反向代理配置模板
#
# 用法（在服务器上执行）：
#   DOMAIN=api.你的域名.com
#   sed -e "s/__DOMAIN__/$DOMAIN/g" deploy/nginx-douyin-parser.conf \
#       > /www/server/panel/vhost/nginx/$DOMAIN.conf
#   nginx -t && nginx -s reload
#
# 也可以直接把内容粘进宝塔：网站 → 设置 → 配置文件
#
# 前提条件（顺序不能颠倒）：
#   1. 域名已解析到本服务器公网 IP
#   2. 已在该站点申请过 Let's Encrypt 证书（否则证书文件不存在，nginx -t 会失败）
#   3. 服务器安全组 / 防火墙已放行 80 和 443
# ---------------------------------------------------------------------------

# 可选限流：每个 IP 每秒 5 个请求。需要时把下面这行的注释去掉，
# 并同时放开 location 里的 limit_req
# limit_req_zone $binary_remote_addr zone=douyin_limit:10m rate=5r/s;

server
{
    listen 80;
    listen 443 ssl http2;
    server_name __DOMAIN__;

    # 宝塔申请 Let's Encrypt 后的证书路径（默认位置，一般不用改）
    ssl_certificate     /www/server/panel/vhost/cert/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/__DOMAIN__/privkey.pem;
    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_ciphers                ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers  on;
    ssl_session_cache          shared:SSL:10m;
    ssl_session_timeout        10m;

    # HTTP 自动跳转 HTTPS。证书申请成功之前请先把这三行注释掉，
    # 否则 Let's Encrypt 的 HTTP 验证会被 301 打断
    if ($server_port = 80) {
        return 301 https://$host$request_uri;
    }

    access_log /www/wwwlogs/__DOMAIN__-proxy.log;
    error_log  /www/wwwlogs/__DOMAIN__-proxy.error.log;

    # Let's Encrypt 续期验证目录。
    # 必须放在反代 location 之前，否则续期请求会被转发给后端，导致证书续期失败。
    # 宝塔新建站点时会自动生成这一段，通常保留即可。
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/__DOMAIN__;
        default_type "text/plain";
        try_files $uri =404;
    }

    location ^~ /
    {
        proxy_pass http://127.0.0.1:5173;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # 解析一个抖音链接要启动无头浏览器，慢时接近 45 秒，还要算上排队。
        # 超时给不够会直接 504
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # 关闭缓冲。/dl 返回的是视频且支持 Range 拖动，
        # 一旦开启缓冲，大文件会先落满临时目录，视频拖动也会失效
        proxy_buffering          off;
        proxy_request_buffering  off;
        proxy_max_temp_file_size 0;

        # 请求体只是一小段 JSON，限制小一点挡掉异常请求
        client_max_body_size 1m;

        # 限流（启用需同时放开文件顶部的 limit_req_zone）
        # limit_req zone=douyin_limit burst=10 nodelay;
    }
}
